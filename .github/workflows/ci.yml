name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      container_image: ${{ steps.filter.outputs.container_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes that require CI jobs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/ci-detect-changes.sh

  check:
    name: Check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13

      - name: Run make check
        run: make check

      - name: Fail when checks leave Git changes behind
        run: |
          modified="$(git status --short)"
          test -z "$modified" || { printf 'Checks left Git changes behind:\n%s\n' "$modified"; exit 1; }

  container-image:
    name: Site Pipeline image
    needs: changes
    # Canonical main publishes in the separate job below; this job verifies pull
    # requests and noncanonical repository runs without publishing.
    if: needs.changes.outputs.container_image == 'true' && (github.event_name == 'pull_request' || (github.repository_owner != 'buildish-tooling' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLATFORMS: linux/amd64,linux/arm64
      LOCAL_REGISTRY_HOST: 127.0.0.1
      LOCAL_REGISTRY_PORT: '5000'
      LOCAL_REGISTRY_REPOSITORY: buildish-site-pipeline-pr
      LOCAL_REGISTRY_TAG: pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set IMAGE_REF for local registry
        run: |
          echo "IMAGE_REF=${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/${LOCAL_REGISTRY_REPOSITORY}:${LOCAL_REGISTRY_TAG}" >> "$GITHUB_ENV"

      - name: Start ephemeral local registry
        run: |
          REGISTRY_IMAGE="$(awk 'toupper($1) == "FROM" { print $2; exit }' tools/site-pipeline-image/Containerfile-local-registry)"
          docker run -d --rm \
            --name site-pipeline-ci-registry \
            -p ${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}:5000 \
            "$REGISTRY_IMAGE"

      - name: Wait for local registry
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/v2/" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Local registry did not become ready" >&2
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true
              insecure = true

      - name: Build multi-platform image into local registry
        run: tools/site-pipeline-image/build-image.sh --engine docker --image "$IMAGE_REF" --platforms "$PLATFORMS" --push

      - name: Verify multi-platform image in local registry
        run: |
          MANIFEST_JSON="$(curl -fsS \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "http://${LOCAL_REGISTRY_HOST}:${LOCAL_REGISTRY_PORT}/v2/${LOCAL_REGISTRY_REPOSITORY}/manifests/${LOCAL_REGISTRY_TAG}")"
          MANIFEST_JSON="$MANIFEST_JSON" python3 - "$PLATFORMS" <<'PY'
          import json
          import os
          import sys

          expected = set()
          for item in sys.argv[1].split(','):
              item = item.strip()
              os_name, arch = item.split('/', 1)
              expected.add((os_name, arch))

          payload = json.loads(os.environ['MANIFEST_JSON'])
          media_type = payload.get('mediaType', '')
          if media_type not in {
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
          }:
              raise SystemExit(f'Unexpected manifest media type: {media_type}')

          found = {
              (entry.get('platform', {}).get('os'), entry.get('platform', {}).get('architecture'))
              for entry in payload.get('manifests', [])
          }
          missing = expected - found
          if missing:
              raise SystemExit(f'Missing expected platforms: {sorted(missing)}; found {sorted(found)}')

          print('Verified manifest platforms:', ', '.join(f'{os_name}/{arch}' for os_name, arch in sorted(found)))
          PY

      - name: Stop ephemeral local registry
        if: ${{ always() }}
        run: docker rm -f site-pipeline-ci-registry || true

  container-publish:
    name: Site Pipeline image publish
    needs:
      - changes
      - check
    # Publish latest only from the canonical repository's main branch.
    if: needs.changes.outputs.container_image == 'true' && github.repository_owner == 'buildish-tooling' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/buildish-site-pipeline:latest
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish multi-platform image to GHCR
        run: tools/site-pipeline-image/build-image.sh --engine docker --image "$IMAGE_REF" --platforms "$PLATFORMS" --push

  codeql:
    name: CodeQL
    ## Temporarily disabled because GitHub Advanced Security is unavailable.
    if: false
    #if: github.repository_owner == 'buildish-tooling'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - changes
      - check
      - container-image
      - container-publish
      - codeql
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded or were intentionally skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          CONTAINER_IMAGE_RESULT: ${{ needs.container-image.result }}
          CONTAINER_PUBLISH_RESULT: ${{ needs.container-publish.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$CHECK_RESULT" \
            "$CONTAINER_IMAGE_RESULT" \
            "$CONTAINER_PUBLISH_RESULT" \
            "$CODEQL_RESULT" \
            "$ZIZMOR_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected dependency result: $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs succeeded for this event."

  publish-site:
    name: Publish aggregate site
    needs: required_checks
    # Requires BUILDISH_SITE_PUBLISH_TOKEN with Actions write access to the
    # buildish-tooling/buildish repository.
    if: >-
      always() &&
      !cancelled() &&
      needs.required_checks.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
      && false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch aggregate site publishing
        env:
          GH_TOKEN: ${{ secrets.BUILDISH_SITE_PUBLISH_TOKEN }}
        run: gh workflow run site-publish.yml --repo buildish-tooling/buildish --ref main
