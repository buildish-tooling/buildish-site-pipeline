[project]
name = "buildish-site-pipeline"
version = "0.1.0"
description = "Reusable multi-repository site staging pipeline"
authors = [{ name = "Buildish", email = "dev@buildish.org" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mistletoe>=1.6.0,<2",
    "pydantic>=2.13.4,<3",
    "python-frontmatter>=1.3.0,<2",
    "pyyaml>=6.0.3",
    "watchfiles>=1.2.0",
]
license-files = [
    "dist-release-legal/LICENSE",
    "dist-release-legal/NOTICE",
]

[project.urls]
Homepage = "https://buildish.org/components/site-pipeline/"
Documentation = "https://buildish.org/components/site-pipeline/development/"
Repository = "https://github.com/buildish-tooling/buildish-site-pipeline"
Issues = "https://github.com/buildish-tooling/buildish-site-pipeline/issues"
Security = "https://buildish.org/community/security/"

[project.scripts]
site-pipeline = "buildish_site_pipeline.cli:main"

[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"
tools = "tools"
"tools.helpers" = "tools/helpers"

[tool.setuptools.packages.find]
where = ["src"]
include = ["buildish_site_pipeline*"]

[tool.setuptools.cmdclass]
bdist_wheel = "buildish_site_pipeline.legal.build_hooks.FlattenedLicenseFilesBdistWheel"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "mypy==2.3.0",
    "ruff==0.16.1",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = [
    # flake8-builtins
    "A",
    # flake8-bugbear
    "B",
    # flake8-future-annotations
    "FA",
    # flake8-datetimez
    "DTZ",
    # Pyflakes
    "F",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-bandit
    "S",
    # pyupgrade
    "UP",
    # flake8-logging
    "LOG",
    # flake8-logging-format
    "G",
    # flake8-use-pathlib
    "PTH",
    # flake8-pyi
    "PYI",
    # flake8-pie
    "PIE",
    # flake8-return
    "RET",
    # flake8-self
    "SLF",
    # flake8-slots
    "SLOT",
    # print()
    "T20",
    # flake8-tidy-imports / banned APIs
    "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.stdout".msg = "Use the CLI logging/reporting helpers instead."
"sys.stderr".msg = "Use the CLI logging/reporting helpers instead."

[tool.ruff.lint.per-file-ignores]
"src/buildish_site_pipeline/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = [
    "main.py",
    "src/buildish_site_pipeline",
    "examples/apache_httpd/generate_redirects.py",
    "examples/roq/sync_stage.py",
]
mypy_path = ["src"]
explicit_package_bases = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
