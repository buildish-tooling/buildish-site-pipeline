[project]
name = "apache-buildish-site-pipeline"
version = "0.1.0"
description = "Reusable multi-repository site staging pipeline"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mistletoe>=1,<2",
    "pydantic>=2.11,<3",
    "python-frontmatter>=1,<2",
    "pyyaml>=6.0.3",
    "watchfiles>=1.1.1",
]

[project.scripts]
site-pipeline = "apache_buildish_site_pipeline.cli:main"

[build-system]
requires = [
    "setuptools>=80",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apache_buildish_site_pipeline*"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "mypy>=1.20.0",
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["F", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"src/apache_buildish_site_pipeline/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = ["main.py", "src/apache_buildish_site_pipeline"]
mypy_path = ["src"]
explicit_package_bases = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
