schemaVersion: 1
defaults:
  metadataFile: site/component.yaml
  pagesRoot: site/pages
  assetsRoot: site/assets
  publication:
    origin: docs
site:
  pagesRoot: site/pages
  assetsRoot: site/assets
origins:
  docs:
    baseUrl: https://smoke.example.test/
    canonical: true
components:
  - slug: site-pipeline
    localDir: components/site-pipeline
    publication:
      mountPath: /components/site-pipeline/
